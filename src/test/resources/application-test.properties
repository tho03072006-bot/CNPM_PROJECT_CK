# =====================================================================
# UTE Cinema - Cau hinh cho TEST TICH HOP (profile "test")
# Phu trach: Tho (Module 4 - Kien truc dung chung + Testing)
#
# Nguyen tac: test KHONG BAO GIO chay tren database dang dev (cinema_booking).
# Test chay tren database rieng "cinema_booking_test" vi truoc moi test case
# chung ta xoa sach du lieu (xem IntegrationTestBase).
#
# Chay 1 lan tren may moi nguoi truoc khi test:
#   sqlcmd -S localhost,1433 -U sa -C -i database\create-test-database.sql
# =====================================================================

# Lay username/password tu file secret chung (khong commit len GitHub).
# URL ben duoi se ghi de URL trong file secret de tro dung vao database test.
spring.config.import=optional:file:./application-secrets.properties

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:1433};databaseName=${TEST_DB_NAME:cinema_booking_test};encrypt=true;trustServerCertificate=true

# Bang trong database test do Hibernate sinh ra tu cac @Entity.
# Dung "update" (KHONG dung "create-drop") de neu lo tro nham vao database that
# thi cung khong xoa mat bang nao.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Test chay nhieu luong that nen can bao du ket noi trong pool
spring.datasource.hikari.maximum-pool-size=20

# Tat tac vu chay nen don ve giu qua han khi chay test.
# Neu de bat, no chay moi 30 giay va co the xoa mat ve ma test vua tao ra,
# lam test thinh thoang do ma khong ai hieu vi sao.
app.seat-hold.cleanup.enabled=false

logging.level.org.hibernate.SQL=WARN
