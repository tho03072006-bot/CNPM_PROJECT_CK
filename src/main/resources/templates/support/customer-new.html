<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Gửi yêu cầu hỗ trợ</title></head>
<body><div layout:fragment="content">
    <a class="module1-back-link" th:href="@{/ho-tro}">← Các yêu cầu của tôi</a>
    <section class="module1-section-head">
        <div><span class="module1-kicker">LIÊN HỆ RẠP</span><h1>Gửi yêu cầu hỗ trợ</h1>
            <p class="text-muted">Mô tả rõ tình huống và mã vé hoặc mã hóa đơn nếu có.</p></div>
    </section>
    <form class="card support-form" th:object="${supportForm}" th:action="@{/ho-tro}" method="post">
        <div class="form-group">
            <label for="category">Bạn cần hỗ trợ về</label>
            <select id="category" class="form-control" th:field="*{category}" required>
                <option value="">Chọn nhóm vấn đề</option>
                <option th:each="category : ${categories}" th:value="${category}" th:text="${category.label}">Đặt vé</option>
            </select>
        </div>
        <div class="form-group">
            <label for="subject">Tiêu đề</label>
            <input id="subject" class="form-control" type="text" th:field="*{subject}"
                   minlength="5" maxlength="200" required placeholder="Ví dụ: Thanh toán thành công nhưng chưa thấy vé">
        </div>
        <div class="form-group">
            <label for="content">Nội dung</label>
            <textarea id="content" class="form-control support-textarea" th:field="*{content}"
                      minlength="10" maxlength="2000" required
                      placeholder="Nêu thời gian xảy ra, mã vé/hóa đơn và nội dung cần rạp kiểm tra."></textarea>
        </div>
        <div class="account-actions">
            <button class="btn btn-accent" type="submit">Gửi cho rạp</button>
            <a class="btn btn-ghost" th:href="@{/ho-tro}">Hủy</a>
        </div>
    </form>
</div></body></html>
