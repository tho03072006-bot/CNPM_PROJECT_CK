<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title th:text="${movieId == null} ? 'Thêm phim' : 'Sửa phim'">Form phim</title></head>
<body><div layout:fragment="content">
    <a class="module1-back-link" th:href="@{/admin/movies}"><span aria-hidden="true">←</span> Quản lý phim</a>
    <div class="module1-form-head">
        <span class="module1-kicker">THÔNG TIN PHIM</span>
        <h1 th:text="${movieId == null} ? 'Thêm phim mới' : 'Cập nhật phim'">Phim</h1>
        <p class="text-muted">Thông tin này sẽ xuất hiện trên trang phim dành cho khán giả.</p>
    </div>
    <form class="card module1-form-panel" th:object="${movieForm}"
          th:action="${movieId == null} ? @{/admin/movies} : @{/admin/movies/{id}(id=${movieId})}"
          method="post">
        <div class="module1-form-grid">
            <div class="form-field module1-field-full"><label for="title">Tên phim *</label>
                <input class="form-control" id="title" type="text" th:field="*{title}" required maxlength="200"
                       placeholder="Ví dụ: Bão Giữa Trời Quang">
                <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span></div>
            <div class="form-field"><label for="genre">Thể loại</label>
                <input class="form-control" id="genre" type="text" th:field="*{genre}" maxlength="100"
                       placeholder="Tâm lý, Hành động, Hoạt hình...">
                <span class="form-error" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></span></div>
            <div class="form-field"><label for="durationMin">Thời lượng (phút) *</label>
                <input class="form-control" id="durationMin" type="number" th:field="*{durationMin}" min="1" required
                       placeholder="120">
                <span class="form-error" th:if="${#fields.hasErrors('durationMin')}" th:errors="*{durationMin}"></span></div>
            <div class="form-field module1-field-full"><label for="description">Nội dung phim</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="5"
                          placeholder="Giới thiệu ngắn gọn nội dung của bộ phim..."></textarea></div>
            <div class="form-field"><label for="posterUrl">Đường dẫn poster</label>
                <input class="form-control" id="posterUrl" type="url" th:field="*{posterUrl}" maxlength="500"
                       placeholder="https://...">
                <span class="form-hint">Để trống sẽ dùng ảnh bìa chữ của rạp.</span>
                <span class="form-error" th:if="${#fields.hasErrors('posterUrl')}" th:errors="*{posterUrl}"></span></div>
            <div class="form-field"><label for="ageRating">Phân loại độ tuổi (bắt buộc)</label>
                <input class="form-control" id="ageRating" type="text" th:field="*{ageRating}" required maxlength="10" list="age-ratings"
                       placeholder="P, K, T13, T16, T18">
                <datalist id="age-ratings"><option value="K"><option value="P"><option value="T13"><option value="T16"><option value="T18"></datalist>
                <span class="form-error" th:if="${#fields.hasErrors('ageRating')}" th:errors="*{ageRating}"></span></div>
        </div>
        <aside class="module1-live-preview" data-movie-preview>
            <div class="module1-preview-poster">
                <img data-poster-image alt="Xem trước poster" hidden>
                <span data-poster-fallback th:text="${movieForm.title != null and !#strings.isEmpty(movieForm.title) ? #strings.substring(movieForm.title, 0, 1) : 'P'}">P</span>
            </div>
            <div><span class="module1-kicker">XEM TRƯỚC</span><strong data-preview-title th:text="${movieForm.title ?: 'Tên phim'}">Tên phim</strong>
                <small data-preview-meta>Poster hiển thị trên trang khách hàng</small></div>
        </aside>
        <div class="module1-form-actions">
            <button class="btn" type="submit">Lưu phim</button>
            <a class="btn btn-ghost" th:href="@{/admin/movies}">Huỷ</a>
        </div>
    </form>
    <script th:src="@{/js/module1-forms.js}" defer></script>
</div></body></html>
