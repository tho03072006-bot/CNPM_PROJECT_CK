<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Đăng nhập</title></head>
<body><div layout:fragment="content">

    <section class="account-panel" aria-labelledby="login-title">
        <div class="account-intro">
            <span class="module1-kicker">UTE CINEMA</span>
            <h1 id="login-title">Đăng nhập</h1>
            <p class="text-muted">Đăng nhập để giữ ghế và xem lại vé đã đặt.</p>
        </div>

        <form class="card account-form" th:object="${loginForm}" th:action="@{/dang-nhap}" method="post">
            <input type="hidden" th:field="*{next}">

            <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <span th:each="loi : ${#fields.globalErrors()}" th:text="${loi}">Lỗi</span>
            </div>

            <div class="form-field">
                <label for="email">Email</label>
                <input class="form-control" id="email" type="email" th:field="*{email}"
                       autocomplete="email" required placeholder="ban@example.com">
                <span class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-field">
                <label for="password">Mật khẩu</label>
                <input class="form-control" id="password" type="password" th:field="*{password}"
                       autocomplete="current-password" required>
                <span class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <button class="btn account-submit" type="submit">Đăng nhập</button>

            <p class="account-switch">
                Chưa có tài khoản?
                <a th:href="@{/dang-ky}">Đăng ký ngay</a>
            </p>
        </form>
    </section>

</div></body></html>
