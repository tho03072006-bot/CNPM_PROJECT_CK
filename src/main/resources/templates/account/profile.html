<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Tài khoản</title></head>
<body><div layout:fragment="content">

    <section class="module1-section-head" aria-labelledby="profile-title">
        <div>
            <span class="module1-kicker">TÀI KHOẢN</span>
            <h1 id="profile-title" th:text="${customer.fullName}">Họ tên</h1>
            <p class="text-muted" th:text="${customer.email}">email</p>
        </div>
        <a class="btn btn-ghost" th:href="@{/dang-xuat}">Đăng xuất</a>
    </section>

    <div class="account-stat-grid">
        <div class="card account-stat">
            <span class="account-stat-label">Vé đã mua</span>
            <strong class="account-stat-value" th:text="${paidCount}">0</strong>
        </div>
        <div class="card account-stat">
            <span class="account-stat-label">Tổng đã chi</span>
            <strong class="account-stat-value"
                    th:text="|${#numbers.formatDecimal(totalPaid, 0, 'POINT', 0, 'COMMA')} đ|">0 đ</strong>
        </div>
        <div class="card account-stat">
            <span class="account-stat-label">Số điện thoại</span>
            <strong class="account-stat-value"
                    th:text="${customer.phone != null and !#strings.isEmpty(customer.phone)} ? ${customer.phone} : 'Chưa có'">
                Chưa có</strong>
        </div>
    </div>

    <section aria-labelledby="history-title">
        <h2 id="history-title" class="pricing-block-title">Lịch sử đặt vé</h2>

        <div class="module1-empty" th:if="${#lists.isEmpty(tickets)}">
            <span class="module1-empty-icon" aria-hidden="true">◷</span>
            <h3>Chưa có vé nào</h3>
            <p>Chọn một suất chiếu để bắt đầu.</p>
            <a class="btn" th:href="@{/lich-chieu}">Xem lịch chiếu</a>
        </div>

        <div class="account-ticket-list" th:unless="${#lists.isEmpty(tickets)}">
            <th:block th:each="ticket : ${tickets}">
                <div th:replace="~{account/ticket-fragment :: ticketCard(${ticket})}"></div>
            </th:block>
        </div>
    </section>

</div></body></html>
