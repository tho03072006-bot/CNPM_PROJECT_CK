<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Đổi mật khẩu</title></head>
<body><div layout:fragment="content">

    <section class="account-panel" aria-labelledby="change-password-title">
        <div class="account-intro">
            <span class="module1-kicker">TÀI KHOẢN</span>
            <h1 id="change-password-title">Đổi mật khẩu</h1>
            <p class="text-muted">Nhập lại mật khẩu hiện tại để xác nhận đúng là bạn.</p>
        </div>

        <!--
          Ba ô mật khẩu cố ý KHÔNG dùng th:field: khi form báo lỗi, th:field sẽ in lại
          giá trị vừa gõ vào thuộc tính value của HTML. Với mật khẩu thì không được.
        -->
        <form class="card account-form" th:object="${changePasswordForm}"
              th:action="@{/tai-khoan/doi-mat-khau}" method="post">

            <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <span th:each="loi : ${#fields.globalErrors()}" th:text="${loi}">Lỗi</span>
            </div>

            <div class="form-field">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <input class="form-control" id="currentPassword" name="currentPassword" type="password"
                       autocomplete="current-password" required>
                <span class="form-error" th:if="${#fields.hasErrors('currentPassword')}"
                      th:errors="*{currentPassword}"></span>
            </div>

            <div class="form-field">
                <label for="newPassword">Mật khẩu mới</label>
                <input class="form-control" id="newPassword" name="newPassword" type="password"
                       autocomplete="new-password" required minlength="6" maxlength="72">
                <span class="form-hint">Ít nhất 6 ký tự, khác mật khẩu hiện tại.</span>
                <span class="form-error" th:if="${#fields.hasErrors('newPassword')}"
                      th:errors="*{newPassword}"></span>
            </div>

            <div class="form-field">
                <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                <input class="form-control" id="confirmPassword" name="confirmPassword" type="password"
                       autocomplete="new-password" required>
                <span class="form-error" th:if="${#fields.hasErrors('confirmPassword')}"
                      th:errors="*{confirmPassword}"></span>
            </div>

            <button class="btn account-submit" type="submit">Đổi mật khẩu</button>

            <p class="account-switch">
                <a th:href="@{/tai-khoan}">Quay lại trang tài khoản</a>
            </p>
        </form>
    </section>

</div></body></html>
