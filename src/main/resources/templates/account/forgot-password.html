<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Khôi phục tài khoản</title></head>
<body><div layout:fragment="content">

    <section class="account-panel" aria-labelledby="forgot-title">
        <div class="account-intro">
            <span class="module1-kicker">TÀI KHOẢN</span>
            <h1 id="forgot-title">Khôi phục tài khoản</h1>
            <p class="text-muted">Quên mật khẩu? Xác thực email đã đăng ký để đặt mật khẩu mới và lấy lại quyền truy cập.</p>
        </div>

        <form class="card account-form" th:action="@{/quen-mat-khau}" method="post">
            <div class="form-field">
                <label for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email"
                       autocomplete="email" required maxlength="150" placeholder="ban@example.com">
            </div>

            <p class="form-hint">Nếu email đã đăng ký, mã OTP sẽ được gửi tới hộp thư. Mã có hiệu lực 5 phút.</p>
            <button class="btn account-submit" type="submit">Gửi mã khôi phục</button>

            <p class="account-switch">
                Nhớ ra rồi?
                <a th:href="@{/dang-nhap}">Quay lại đăng nhập</a>
            </p>
        </form>
    </section>

</div></body></html>
