<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Đặt lại mật khẩu</title></head>
<body><div layout:fragment="content">

    <section class="account-panel" aria-labelledby="reset-title">
        <div class="account-intro">
            <span class="module1-kicker">TÀI KHOẢN</span>
            <h1 id="reset-title">Đặt mật khẩu mới</h1>
            <p class="text-muted" th:text="|Cho tài khoản ${email}|">Cho tài khoản ban@example.com</p>
        </div>

        <!-- Hai ô mật khẩu cố ý không dùng th:field để form báo lỗi không in lại mật khẩu vào HTML. -->
        <form class="card account-form" th:object="${resetPasswordForm}"
              th:action="@{/dat-lai-mat-khau}" method="post">
            <input type="hidden" th:field="*{token}">

            <div class="form-field">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="auth-password">
                <input class="form-control" id="newPassword" name="newPassword" type="password"
                       autocomplete="new-password" required minlength="6" maxlength="72">
                <button hidden type="button" class="auth-toggle" data-password-toggle="newPassword" aria-controls="newPassword" aria-pressed="false">Hiện</button>
                </div>
                <span class="form-hint">Ít nhất 6 ký tự.</span>
                <span class="form-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
            </div>

            <div class="form-field">
                <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                <input class="form-control" id="confirmPassword" name="confirmPassword" type="password"
                       autocomplete="new-password" required maxlength="72">
                <span class="form-error" th:if="${#fields.hasErrors('confirmPassword')}"
                      th:errors="*{confirmPassword}"></span>
            </div>

            <button class="btn account-submit" type="submit">Lưu mật khẩu mới</button>
        </form>
    </section>
    <script defer th:src="@{/js/account.js}"></script>

</div></body></html>
