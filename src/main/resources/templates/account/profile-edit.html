<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Sửa hồ sơ</title></head>
<body><div layout:fragment="content">

    <section class="account-panel" aria-labelledby="profile-edit-title">
        <div class="account-intro">
            <span class="module1-kicker">TÀI KHOẢN</span>
            <h1 id="profile-edit-title">Sửa hồ sơ</h1>
            <p class="text-muted">Họ tên hiện trên vé và trong email xác nhận.</p>
        </div>

        <form class="card account-form" th:object="${profileForm}" th:action="@{/tai-khoan/sua}" method="post">

            <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <span th:each="loi : ${#fields.globalErrors()}" th:text="${loi}">Lỗi</span>
            </div>

            <div class="form-field">
                <label for="accountEmail">Email</label>
                <input class="form-control" id="accountEmail" type="email" th:value="${email}"
                       readonly aria-describedby="accountEmailHint">
                <span class="form-hint" id="accountEmailHint">Email là tên đăng nhập nên không đổi được.</span>
            </div>

            <div class="form-field">
                <label for="fullName">Họ và tên</label>
                <input class="form-control" id="fullName" type="text" th:field="*{fullName}"
                       autocomplete="name" required maxlength="150">
                <span class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>

            <div class="form-field">
                <label for="phone">Số điện thoại</label>
                <input class="form-control" id="phone" type="tel" th:field="*{phone}"
                       autocomplete="tel" maxlength="11" placeholder="0901234567">
                <span class="form-hint">Không bắt buộc. Để trống là xoá số đã lưu.</span>
                <span class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <button class="btn account-submit" type="submit">Lưu hồ sơ</button>

            <p class="account-switch">
                <a th:href="@{/tai-khoan}">Quay lại trang tài khoản</a>
            </p>
        </form>
    </section>

</div></body></html>
