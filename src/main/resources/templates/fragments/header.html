<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Thanh điều hướng dùng chung (Thọ quản lý - không tự ý sửa).
  Module nào cần thêm mục menu thì báo trước trong nhóm chat.

  Hình logo: bánh răng lấy ý tưởng từ logo trường, ở giữa là lỗ phim.
  Màu lấy từ biến CSS nên đổi tông màu cả trang thì hình này tự đổi theo.
-->
<header th:fragment="header" class="site-header">
    <div class="container header-inner">
        <a th:href="@{/}" class="logo">
            <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <g fill="currentColor">
                    <rect x="21" y="1" width="6" height="11" rx="2"/>
                    <rect x="21" y="36" width="6" height="11" rx="2"/>
                    <rect x="1" y="21" width="11" height="6" rx="2"/>
                    <rect x="36" y="21" width="11" height="6" rx="2"/>
                    <g transform="rotate(45 24 24)">
                        <rect x="21" y="1" width="6" height="11" rx="2"/>
                        <rect x="21" y="36" width="6" height="11" rx="2"/>
                        <rect x="1" y="21" width="11" height="6" rx="2"/>
                        <rect x="36" y="21" width="11" height="6" rx="2"/>
                    </g>
                </g>
                <circle cx="24" cy="24" r="15" fill="currentColor"/>
                <circle cx="24" cy="24" r="9.5" fill="var(--surface-inverse)"/>
                <circle cx="24" cy="24" r="3.2" fill="currentColor"/>
            </svg>
            <span class="logo-text">
                Nhóm 8 Cinema
                <small>Đặt vé xem phim</small>
            </span>
        </a>

        <nav class="header-nav" aria-label="Điều hướng chính">
            <a th:href="@{/}">Trang chủ</a>
            <a th:href="@{/movies}">Phim</a>
            <a th:href="@{/login}">Đăng nhập</a>

            <!--
              Nút đổi sáng/tối. Nhãn aria-label do theme.js đặt lại theo chế độ
              đang dùng, nên người dùng trình đọc màn hình biết bấm vào sẽ ra gì.
            -->
            <button type="button" class="theme-toggle" data-theme-toggle
                    aria-label="Chuyển giao diện sáng tối">
                <svg class="icon-to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
                </svg>
                <svg class="icon-to-light" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>
                </svg>
            </button>
        </nav>
    </div>
</header>
</body>
</html>
