<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Đã có lỗi xảy ra</title>
</head>
<body>
<!--
  Trang báo lỗi chung cho cả hệ thống (Thọ quản lý - không tự ý sửa).

  Trang này được dùng trong 2 trường hợp:
    1. GlobalExceptionHandler bắt được lỗi nghiệp vụ -> có sẵn errorCode / errorMessage / errorPath.
    2. Spring Boot tự xử lý lỗi (vd gõ nhầm đường dẫn -> 404) -> Spring đưa vào status / error / path.
  Vì vậy chỗ nào cũng có 2 nhánh dự phòng.

  Câu thông báo (errorMessage) ĐÃ được fragment alert ở layout in ra bên trên rồi,
  ở đây không in lại để khỏi bị lặp 2 lần.
-->
<div layout:fragment="content">
    <div class="error-page">
        <p class="error-code" th:text="${errorCode != null ? errorCode : status}">500</p>
        <h1>Đã có lỗi xảy ra</h1>

        <p class="error-detail" th:if="${errorMessage == null}"
           th:text="${error != null ? error : 'Hệ thống gặp sự cố không mong muốn. Vui lòng thử lại sau.'}">
            Chi tiết lỗi
        </p>

        <p class="error-path" th:if="${errorPath != null or path != null}">
            Đường dẫn: <code th:text="${errorPath != null ? errorPath : path}">/duong-dan</code>
        </p>

        <p>
            <a class="btn" th:href="@{/}">Về trang chủ</a>
        </p>
    </div>
</div>
</body>
</html>
