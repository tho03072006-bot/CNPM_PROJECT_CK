<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Da co loi xay ra</title>
</head>
<body>
<!--
  Trang bao loi chung cho ca he thong (Tho quan ly - khong tu y sua).

  Trang nay duoc dung trong 2 truong hop:
    1. GlobalExceptionHandler bat duoc loi nghiep vu -> co san errorCode / errorMessage / errorPath.
    2. Spring Boot tu xu ly loi (vd go nham duong dan -> 404) -> Spring dua vao status / error / path.
  Vi vay cho nao cung co 2 nhanh du phong.

  Cau thong bao (errorMessage) DA duoc fragment alert o layout in ra ben tren roi,
  o day khong in lai de khoi bi lap 2 lan.
-->
<div layout:fragment="content">
    <div class="error-page">
        <p class="error-code" th:text="${errorCode != null ? errorCode : status}">500</p>
        <h1>Da co loi xay ra</h1>

        <p class="error-detail" th:if="${errorMessage == null}"
           th:text="${error != null ? error : 'He thong gap su co khong mong muon. Vui long thu lai sau.'}">
            Chi tiet loi
        </p>

        <p class="error-path" th:if="${errorPath != null or path != null}">
            Duong dan: <code th:text="${errorPath != null ? errorPath : path}">/duong-dan</code>
        </p>

        <p>
            <a class="btn" th:href="@{/}">Ve trang chu</a>
        </p>
    </div>
</div>
</body>
</html>
