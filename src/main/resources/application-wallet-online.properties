# MoMo gia lap Nhom 8: chi cong vi duoc cong khai tren Render.
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=framework
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2

# Chi dung bien moi truong, khong dong goi file mat khau vao image.
spring.config.import=
spring.datasource.url=${WALLET_DB_URL}
spring.datasource.username=${WALLET_DB_USERNAME}
spring.datasource.password=${WALLET_DB_PASSWORD}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true

demo-wallet.enabled=true
demo-wallet.require-public-url=true
demo-wallet.public-base-url=${RENDER_EXTERNAL_URL}
demo-wallet.gateway-enabled=true
demo-wallet.gateway-address=0.0.0.0
demo-wallet.gateway-port=${PORT:10000}

app.mail.enabled=false
# Web local van don giu ghe; vi chi xac nhan dung han, khong chay job don ca database.
app.seat-hold.cleanup.enabled=false

# Giao dien/API xac nhan vi chi chay tren backend online.
demo-wallet.phone-enabled=true
demo-wallet.warmup-enabled=false
