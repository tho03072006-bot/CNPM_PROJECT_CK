# =====================================================================
# Cinema Booking - NHÓM 05 - Profile "cloud"
# Dùng khi chạy ứng dụng trên DATABASE DÙNG CHUNG của nhóm.
# Xem docs/DATABASE.md
#
# Cách chạy:
#   mvn spring-boot:run -Dspring-boot.run.profiles=cloud
#
# Trước khi chạy lần đầu:
#   1. Copy application-secrets-cloud.properties.example -> application-secrets-cloud.properties
#   2. Điền thông tin server cloud (Thọ gửi riêng trong nhóm chat, KHÔNG đưa vào Git)
# =====================================================================

spring.config.import=optional:file:./application-secrets-cloud.properties

# Khai báo thẳng ở đây (thay vì để trong file secret) để chắc chắn ghi đè được
# cấu hình database local trong application-secrets.properties.
#
# Chuỗi kết nối viết theo kiểu KHÔNG phụ thuộc nhà cung cấp: cổng và các tham số
# thừa đều để người dùng tự điền qua cloud.db.port và cloud.db.options, nhờ vậy
# đổi sang nhà cung cấp SQL Server khác chỉ phải sửa file secret, không sửa file này.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${cloud.db.server}:${cloud.db.port:1433};database=${cloud.db.name};${cloud.db.options:encrypt=true;trustServerCertificate=true};loginTimeout=60
spring.datasource.username=${cloud.db.username}
spring.datasource.password=${cloud.db.password}

# QUAN TRỌNG: trên database dùng chung, Hibernate CHỈ được kiểm tra schema, KHÔNG được tự sửa.
# Muốn đổi bảng/cột -> sửa database/schema-cloud.sql rồi báo cả nhóm (xem docs/DATABASE.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Database free thường "ngủ" khi không ai dùng, lần kết nối đầu tiên sau khi ngủ
# có thể mất 30-60 giây để đánh thức -> nới lỏng timeout và giữ ít kết nối để đỡ tốn hạn mức.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
