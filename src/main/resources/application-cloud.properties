# =====================================================================
# Cinema Booking - NHOM05 - Profile "cloud"
# Dung khi chay ung dung tren DATABASE DUNG CHUNG cua nhom (Azure SQL Database).
# Xem docs/ADR-002-database-dung-chung-tren-cloud.md
#
# Cach chay:
#   mvn spring-boot:run -Dspring-boot.run.profiles=cloud
#
# Truoc khi chay lan dau:
#   1. Copy application-secrets-cloud.properties.example -> application-secrets-cloud.properties
#   2. Dien thong tin server cloud (Tho gui rieng trong nhom chat, KHONG dua vao Git)
# =====================================================================

spring.config.import=optional:file:./application-secrets-cloud.properties

# Khai bao thang o day (thay vi de trong file secret) de chac chan ghi de duoc
# cau hinh database local trong application-secrets.properties.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${cloud.db.server}:1433;database=${cloud.db.name};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=60
spring.datasource.username=${cloud.db.username}
spring.datasource.password=${cloud.db.password}

# QUAN TRONG: tren database dung chung, Hibernate CHI duoc kiem tra schema, KHONG duoc tu sua.
# Muon doi bang/cot -> sua database/schema-azure.sql roi bao ca nhom (ADR-002).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Database free tren Azure se "ngu" khi khong ai dung, lan ket noi dau tien sau khi ngu
# co the mat 30-60 giay de danh thuc -> noi long timeout va giu it ket noi de do ton han muc.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
