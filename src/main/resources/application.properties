# ==== UTE Cinema ====
server.port=8082

spring.application.name=cinema-booking

# Chi theo doi phien bang cookie. Neu de mac dinh, Tomcat con viet them ;jsessionid=...
# vao URL o lan chuyen huong dau tien (luc trinh duyet chua kip nhan cookie), ma Spring
# Boot 3 khong cat path parameter nen "/;jsessionid=..." khong khop route nao va ra 404.
# Lo ra dung luc dang nhap tren trinh duyet sach - tinh huong cua buoi demo.
server.servlet.session.tracking-modes=cookie

# Nap file bi mat (khong commit len GitHub) - xem application-secrets.properties.example
spring.config.import=optional:file:./application-secrets.properties

# ==== Database (SQL Server) ====
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.url=...          -> dat trong application-secrets.properties
# spring.datasource.username=...     -> dat trong application-secrets.properties
# spring.datasource.password=...     -> dat trong application-secrets.properties

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ==== Thymeleaf ====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ==== CSS / JS tinh ====
# Bat trinh duyet hoi lai server moi lan tai CSS/JS (file chua doi thi server chi tra 304, rat nhe).
# Thieu dong nay thi Chrome tu giu ban style.css cu hang gio sau khi nhom sua giao dien, trang
# hien ra vo bo cuc. Ngay 02/10/2026 trang hoa don da bi dung loi nay khi bam In.
spring.web.resources.cache.cachecontrol.no-cache=true

# ==== Mail (Gmail SMTP hoac Mailtrap) ====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# spring.mail.username=...   -> dat trong application-secrets.properties
# spring.mail.password=...   -> dat trong application-secrets.properties (App Password, khong phai mat khau Gmail)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==== App config ====
app.seat-hold-minutes=5

# Dia chi goc cua trang web, dung de ghep link trong email (dat lai mat khau) va de MoMo
# dua khach quay ve. Doc tu cau hinh chu KHONG doc tu header Host cua request, nen ke xau
# khong gai duoc link gia vao thu gui khach. Dua len may chu that thi doi thanh ten mien.
app.base-url=http://localhost:8082

# Tat han viec gui email (profile test dat false). Mat khau Gmail va khoa MoMo nam trong
# application-secrets.properties - xem application-secrets.properties.example.
app.mail.enabled=true

# Giao dien/API xac nhan vi chi chay tren backend online.
demo-wallet.phone-enabled=false
